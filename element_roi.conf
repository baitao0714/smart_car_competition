# element_roi.conf - 调整后会被程序热加载
# red_min_area: 红色标记最小面积（像素）
# white_trigger_percent: 红框内白色占比触发阈值（%）
# stable_frames_need: 连续稳定帧数
# red_h1_min / red_h1_max: 红色第一段 Hue 范围
# red_h2_min / red_h2_max: 红色第二段 Hue 范围
# red_s_min: 红色最小饱和度
# red_v_min: 红色最小亮度
# roi_width_scale_percent: 识别 ROI 相对红框宽度的百分比（例如 220 表示 2.2 倍）
# roi_height_scale_percent: 识别 ROI 相对红框高度的百分比
# roi_gap_pixels: 识别 ROI 与红框之间的垂直间距（像素）
# roi_x_offset_pixels / roi_y_offset_pixels: ROI 的像素偏移微调
# enable: 0/1 开关检测功能

red_min_area=100
white_trigger_percent=0
stable_frames_need=1
red_h1_min=0
red_h1_max=10
red_h2_min=156
red_h2_max=180   
red_v_min=60    # 亮度阈值，避免过暗环境误检   光照偏暗时，先适当降低 red_v_min
red_s_min=80    # 饱和度阈值，避免过灰环境误检  红色不够纯时，适当降低 red_s_min
roi_width_scale_percent=100
roi_height_scale_percent=180
roi_gap_pixels=4
roi_x_offset_pixels=0
roi_y_offset_pixels=0
enable=1
